name: Dependency Security

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Audit locked runtime dependencies
        run: |
          python -m pip install 'pip-audit==2.10.1'
          pip-audit --disable-pip --require-hashes --progress-spinner off -r requirements-release-runtime.lock

  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Audit static build dependencies including devDependencies
        run: npm audit --package-lock-only --ignore-scripts --audit-level=low --registry=https://registry.npmjs.org

  runtime-base:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Audit fixable runtime base OS vulnerabilities
        run: |
          image="$(awk '$1 == "FROM" && $2 ~ /^python:/ {print $2}' Dockerfile)"
          test -n "$image"
          echo 'OS gate blocks published fixes; unresolved distribution advisories still require review.'
          docker run --rm ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --image-src remote --scanners vuln --pkg-types os --ignore-unfixed --exit-code 1 "$image"
