preset = "basic"
python-interpreter-path = ".venv/bin/python"
# 直接运行 tests/*.py 时，Python 会将 tests/ 作为兄弟模块的导入根。
search-path = [".", "packaging/scripts", "tests"]
project-includes = [
    "app/**/*.py",
    "tests/**/*.py",
    "packaging/**/*.py",
    "*.py",
]
ignore-missing-imports = [
    "anitomy_ng",
    "anitomy_ng.*",
    "playwright",
    "playwright.*",
]
