<script>
(function(){
    let previewId='';
    let previewUrl='';
    let files=[];
    let inspectGeneration=0;
    let inspectController=null;
    let submitting=false;
    let targetSelected=false;

    const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const formatSize=size=>{
        const n=Number(size)||0;
        if(!n) return '文件夹';
        if(n>=1073741824) return (n/1073741824).toFixed(2)+' GB';
        if(n>=1048576) return (n/1048576).toFixed(1)+' MB';
        return (n/1024).toFixed(1)+' KB';
    };
    function setState(text,tone=''){
        const tag=document.getElementById('shareStateTag');
        let icon = 'clock';
        if(tone === 'is-success') icon = 'check-circle-2';
        else if(tone === 'is-danger') icon = 'alert-circle';
        else if(text.includes('中')) icon = 'loader-2';
        tag.innerHTML = `<i data-lucide="${icon}"></i><span>${escapeHtml(text)}</span>`;
        tag.className = 'share-status-badge ' + tone;
        window.renderLucideIcons?.(tag);
    }
    function renderActionButton(id,busy,label,icon){
        const button=document.getElementById(id);
        button.disabled=busy;
        button.innerHTML=`<i data-lucide="${busy?'loader-2':icon}" class="${busy?'spin':''}"></i> ${label}`;
        window.renderLucideIcons?.(button);
    }
    function selectedIds(){
        return [...document.querySelectorAll('.share-file-check:checked')].map(el=>el.value);
    }
    function updateSelection(){
        const selected=selectedIds();
        const currentUrl=document.getElementById('shareUrl').value.trim();
        const validPreview=Boolean(previewId&&previewUrl&&previewUrl===currentUrl);
        document.getElementById('shareSelectionCount').textContent=`已选择 ${selected.length} / ${files.length} 项`;
        document.getElementById('shareCheckAll').checked=files.length>0&&selected.length===files.length;
        document.getElementById('shareCheckAll').indeterminate=selected.length>0&&selected.length<files.length;
        document.getElementById('restoreShareBtn').disabled=submitting||!validPreview||!selected.length;
        if(validPreview&&!submitting) document.getElementById('shareTransferSummary').textContent=`${selected.length} 项将转存到「${document.getElementById('shareTargetDirName').value}」`;
    }
    function invalidateSharePreview(message=''){
        const hadPreview=Boolean(previewId||files.length||inspectController);
        inspectGeneration+=1;
        inspectController?.abort();
        inspectController=null;
        renderActionButton('inspectShareBtn',false,'解析分享','scan-line');
        previewId='';
        previewUrl='';
        files=[];
        document.getElementById('shareTransferSummary').textContent='尚未解析分享链接';
        document.getElementById('shareFileToolbar').hidden=true;
        document.getElementById('shareFileList').replaceChildren();
        updateSelection();
        if(message&&hadPreview){
            document.getElementById('shareMessage').textContent=message;
            setState('待重新解析');
        }
    }
    function renderFiles(){
        const list=document.getElementById('shareFileList');
        document.getElementById('shareFileToolbar').hidden=false;
        list.innerHTML=files.map(item=>`<label class="share-file-row">
            <input type="checkbox" class="share-file-check" value="${escapeHtml(item.id)}" checked>
            <span class="share-file-type-icon"><i data-lucide="${item.is_dir?'folder':'file-text'}"></i></span>
            <div class="share-file-meta">
                <strong title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</strong>
                <small>${item.is_dir?'目录 / 文件夹':formatSize(item.size)} · ID ${escapeHtml(item.id)}</small>
            </div>
        </label>`).join('');
        window.renderLucideIcons?.(list);
        list.querySelectorAll('.share-file-check').forEach(el=>el.addEventListener('change',updateSelection));
        updateSelection();
    }
    async function inspectShare(){
        const url=document.getElementById('shareUrl').value.trim();
        if(!url){ document.getElementById('shareMessage').textContent='请输入有效的光鸭分享链接'; return; }
        invalidateSharePreview();
        const generation=inspectGeneration;
        const controller=new AbortController();
        inspectController=controller;
        renderActionButton('inspectShareBtn',true,'解析分享','scan-line');
        setState('解析中');
        try{
            const response=await fetch('/api/share/inspect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url}),signal:controller.signal});
            const data=await response.json();
            if(generation!==inspectGeneration||controller.signal.aborted||document.getElementById('shareUrl').value.trim()!==url)return;
            if(!response.ok) throw new Error(data.error||'解析失败');
            previewId=data.preview_id; previewUrl=url; files=data.files||[];
            document.getElementById('shareMessage').textContent=`分享 ID: ${data.share_id} · 共 ${data.count} 项文件 · 预览 15 分钟内有效`;
            setState('解析完成','is-success'); renderFiles();
        }catch(error){
            if(error.name==='AbortError'||generation!==inspectGeneration)return;
            document.getElementById('shareMessage').textContent=error.message;
            document.getElementById('shareFileToolbar').hidden=true;
            document.getElementById('shareFileList').innerHTML=`<div class="share-empty-state">
                <div class="share-empty-icon" style="color:var(--danger);background:rgba(239,68,68,0.1);"><i data-lucide="alert-triangle"></i></div>
                <strong>解析失败</strong>
                <p>${escapeHtml(error.message||'请检查提取码与分享链接有效性')}</p>
            </div>`;
            window.renderLucideIcons?.(document.getElementById('shareFileList'));
            setState('解析失败','is-danger');
        }finally{
            if(generation===inspectGeneration){
                inspectController=null;
                renderActionButton('inspectShareBtn',false,'解析分享','scan-line');
            }
        }
    }
    function renderTarget(directory){
        document.getElementById('shareTargetDir').value=String(directory.id||'0');
        document.getElementById('shareTargetDirName').value=directory.name||'根目录';
        const value=document.getElementById('shareTargetValue');
        value.innerHTML = `
            <div class="share-target-icon"><i data-lucide="folder-tree"></i></div>
            <div class="share-target-details">
                <strong>${escapeHtml(directory.name||'根目录')}</strong>
                <small>ID ${escapeHtml(String(directory.id||'0'))}</small>
            </div>
        `;
        window.renderLucideIcons?.(value);
        updateSelection();
    }
    function openTargetPicker(){
        openGuangYaDirectoryPicker({
            modalId:'shareDirModal',
            title:'选择转存目标目录',
            onSelect:(directory)=>{targetSelected=true;renderTarget(directory);},
        });
    }
    async function saveDefaultTarget(){
        const btn=document.getElementById('saveShareTargetBtn');
        btn.disabled=true;
        try{
            const response=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
                GY_SHARE_TARGET_DIR:document.getElementById('shareTargetDir').value,
                GY_SHARE_TARGET_DIR_NAME:document.getElementById('shareTargetDirName').value,
            })});
            const data=await response.json();
            if(!response.ok) throw new Error(data.error||'保存失败');
            document.getElementById('shareMessage').textContent='默认转存目录已保存';
        }catch(error){document.getElementById('shareMessage').textContent=error.message;}
        finally{btn.disabled=false;}
    }
    const wait=milliseconds=>new Promise(resolve=>window.setTimeout(resolve,milliseconds));
    function renderTransferStatus(state,message,summary,tone=''){
        setState(state,tone);
        document.getElementById('shareMessage').textContent=message;
        document.getElementById('shareTransferSummary').textContent=summary;
    }
    async function followShareRequest(requestId,targetName,generation){
        let queryFailures=0;
        for(let attempt=0;attempt<45;attempt+=1){
            await wait(2000);
            if(generation!==inspectGeneration)return;
            try{
                const response=await fetch(`/api/share/requests/${encodeURIComponent(requestId)}`,{headers:{Accept:'application/json'},cache:'no-store'});
                const data=await response.json();
                if(generation!==inspectGeneration)return;
                if(!response.ok) throw new Error(data.error||'状态查询失败');
                queryFailures=0;
                if(!data.terminal){
                    document.getElementById('shareMessage').textContent=`转存请求 ${requestId} 正在处理`;
                    continue;
                }
                if(data.success){
                    renderTransferStatus('转存成功',`转存请求 ${requestId} 已完成 · 目标「${data.target_dir_name||targetName}」`,'本次转存已完成','is-success');
                }else{
                    renderTransferStatus(data.status==='manual_review'?'需要核对':'转存失败',data.error||`转存请求 ${requestId} 未完成，请重新解析后重试`,'请核对目标目录或重新解析分享链接','is-danger');
                }
                return;
            }catch(error){
                if(generation!==inspectGeneration)return;
                if(++queryFailures>=3){
                    renderTransferStatus('状态待确认',`转存请求 ${requestId} 已受理，但暂时无法查询状态，请稍后在下载或日志页面核对`,'请求仍可能在后台执行');
                    return;
                }
            }
        }
        renderTransferStatus('仍在处理',`转存请求 ${requestId} 仍在处理，请稍后在下载或日志页面核对`,'请求已受理并在后台继续执行');
    }

    async function restoreShare(){
        if(submitting)return;
        const ids=selectedIds();
        const currentUrl=document.getElementById('shareUrl').value.trim();
        if(!previewId||!ids.length||previewUrl!==currentUrl){invalidateSharePreview('分享链接已变化，请重新解析后再转存');return;}
        // 确认与提交共用同一份参数；异步回执只属于发起时的预览。
        const generation=inspectGeneration;
        const body={preview_id:previewId,file_ids:ids,target_dir_id:document.getElementById('shareTargetDir').value,target_dir_name:document.getElementById('shareTargetDirName').value};
        const targetName=body.target_dir_name;
        submitting=true;updateSelection();
        try{
            const confirmed=await appConfirm({title:'确认分享转存',message:`把 ${ids.length} 项文件转存到「${targetName}」。该操作将在云盘直接执行。`,confirmText:'开始转存'});
            if(!confirmed||generation!==inspectGeneration)return;
            renderActionButton('restoreShareBtn',true,'执行转存','cloud-download');
            const response=await fetch('/api/share/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
            const data=await response.json();
            if(generation!==inspectGeneration)return;
            if(!response.ok)throw new Error(data.error||'转存失败');
            previewId='';previewUrl='';
            if(response.status===202||(data.accepted&&data.duplicate)){
                renderTransferStatus('请求处理中',`相同请求正在处理${data.request_id?` · 请求 ${data.request_id}`:''}`,'已复用正在执行的转存请求，正在跟踪结果');
                if(data.request_id) void followShareRequest(data.request_id,targetName,generation);
            }else{
                renderTransferStatus('转存成功',`已成功转存 ${data.count||0} 项到「${data.target_dir_name||targetName}」`,'本次转存已完成','is-success');
            }
        }catch(error){
            if(generation===inspectGeneration){setState('转存失败','is-danger');document.getElementById('shareMessage').textContent=error.message;}
        }finally{
            submitting=false;
            renderActionButton('restoreShareBtn',false,'执行转存','cloud-download');
            updateSelection();
        }
    }
    document.getElementById('inspectShareBtn').addEventListener('click',inspectShare);
    document.getElementById('shareUrl').addEventListener('input',()=>invalidateSharePreview('分享链接已变化，请重新解析'));
    document.getElementById('shareCheckAll').addEventListener('change',e=>{document.querySelectorAll('.share-file-check').forEach(el=>el.checked=e.target.checked);updateSelection();});
    document.getElementById('pickShareTargetBtn').addEventListener('click',openTargetPicker);
    document.getElementById('saveShareTargetBtn').addEventListener('click',saveDefaultTarget);
    document.getElementById('restoreShareBtn').addEventListener('click',restoreShare);
    loadAppConfig().catch(()=>({})).then(config=>{
        if(!targetSelected)renderTarget({id:config.GY_SHARE_TARGET_DIR||'0',name:config.GY_SHARE_TARGET_DIR_NAME||'根目录'});
    });
})();
</script>
