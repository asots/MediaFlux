{# 在 defer 脚本和会话 API 之前选择首绘布局；只读取布局提示，不缓存或展示历史正文。 #}
<script>
(function () {
    try {
        const current = localStorage.getItem('mediaflux.agent.kernel.session.v1') || '';
        if (!/^[A-Za-z0-9_-]{16,64}$/.test(current)) return;
        const raw = localStorage.getItem('mediaflux.agent.kernel.layout.v1') || '';
        let hint = null;
        try { if (raw.length < 256) hint = JSON.parse(raw); } catch (_) { /* 旧版没有布局提示。 */ }
        if (hint?.session_id === current && hint.mode === 'empty') return;
        const node = document.currentScript.parentElement;
        node.classList.remove('is-empty');
        node.classList.add('is-restoring');
        node.dataset.initialRestore = 'true';
        node.setAttribute('aria-busy', 'true');
    } catch (_) { /* 浏览器禁用存储时保持可用的新会话布局。 */ }
})();
</script>
